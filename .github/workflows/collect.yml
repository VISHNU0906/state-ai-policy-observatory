name: Collect policy candidates
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: read
concurrency:
  group: daily-collection
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Monthly budget cache key
        id: month
        run: echo "value=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache/provider-usage.json
          key: provider-usage-${{ steps.month.outputs.value }}-${{ github.run_id }}
          restore-keys: provider-usage-${{ steps.month.outputs.value }}-
      - name: Discover candidates with independent providers
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TAVILY_MONTHLY_REQUEST_CAP: '720'
          EXA_MONTHLY_REQUEST_CAP: '720'
        run: python collectors.py --providers google-rss,gdelt,tavily,exa --days 7 --limit 10 --max-calls 12 --output-dir scheduled-runs
      - name: Save candidates and provider failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-candidates-${{ github.run_id }}
          path: |
            scheduled-runs/*.json
            .cache/provider-usage.json
          retention-days: 30
      - name: Explain review boundary
        if: always()
        run: |
          echo 'Candidate collection only. Nothing is published without review.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the artifact within 30 days. Scheduled starts are best-effort.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Schedule: 02:17 UTC / 07:47 India Standard Time.' >> "$GITHUB_STEP_SUMMARY"
