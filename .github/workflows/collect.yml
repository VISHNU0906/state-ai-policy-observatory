name: Collect policy candidates
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: read
concurrency:
  group: daily-collection
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Discover candidates with free sources
        run: python collectors.py --providers google-rss,gdelt --days 7 --limit 10 --max-calls 12
      - name: Save candidates and provider failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-candidates-${{ github.run_id }}
          path: runs/multiprovider-*.json
          retention-days: 30
      - name: Explain review boundary
        if: always()
        run: |
          echo 'Candidate collection only. Nothing is published without review.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the artifact within 30 days. Scheduled starts are best-effort.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Schedule: 02:17 UTC / 07:47 India Standard Time.' >> "$GITHUB_STEP_SUMMARY"
